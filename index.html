<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hill Run</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <canvas id="game" width="480" height="270" tabindex="0" aria-label="Hill Run game"></canvas>
      <p class="help">
        On the title, Left and Right pick Easy, Medium, or Hard.<br />
        Arrows or WASD move · Z or Space jump · X or Shift run · C fire · Down on a pipe enters · Enter pauses.<br />
        Serve this folder over HTTP so the stages can load.
      </p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
